<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>renri Design Preview</title>
  <style>
    :root {
      --bg: #f7f7f5;
      --surface: #ffffff;
      --ink: #222222;
      --muted: #6d6b66;
      --line: #dedbd4;
      --accent: #7c6a4f;
      --accent-dark: #403829;
      --shadow: 0 18px 48px rgba(34, 34, 34, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Yu Mincho", "Hiragino Mincho ProN", "Noto Serif JP", serif;
      line-height: 1.8;
    }

    a {
      color: inherit;
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid var(--line);
      background: rgba(247, 247, 245, 0.96);
      backdrop-filter: blur(10px);
    }

    .header-inner {
      max-width: 1180px;
      margin: 0 auto;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      display: grid;
      gap: 2px;
      color: inherit;
      text-decoration: none;
    }

    .brand-title {
      font-size: 26px;
      font-weight: 400;
      letter-spacing: 5px;
      line-height: 1;
    }

    .brand-label,
    .meta-key,
    .preview-info,
    .button,
    .nav-link,
    .site-footer {
      font-family: Arial, sans-serif;
      letter-spacing: 0;
    }

    .brand-label {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.3;
      text-transform: uppercase;
    }

    .header-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .nav-link,
    .button {
      min-height: 38px;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      padding: 8px 13px;
      font-size: 12px;
      text-decoration: none;
      white-space: nowrap;
    }

    .nav-link {
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--accent-dark);
      transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
    }

    .nav-link:hover,
    .nav-link:focus-visible {
      border-color: var(--accent);
      box-shadow: 0 8px 22px rgba(64, 56, 41, 0.1);
      transform: translateY(-1px);
      outline: none;
    }

    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 56px 24px 88px;
    }

    .intro {
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(280px, 0.9fr);
      align-items: end;
      gap: 40px;
      padding-bottom: 42px;
      border-bottom: 1px solid var(--line);
    }

    h1 {
      margin: 0;
      font-size: 38px;
      font-weight: 400;
      line-height: 1.45;
      letter-spacing: 0;
    }

    .lead {
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 15px;
    }

    .meta-panel,
    .preview {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .meta-panel {
      padding: 22px;
    }

    .meta-row {
      display: grid;
      grid-template-columns: 92px 1fr;
      gap: 16px;
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
      font-size: 14px;
    }

    .meta-row:last-child {
      border-bottom: 0;
    }

    .meta-key {
      color: var(--muted);
      font-size: 12px;
    }

    .quick-links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 28px;
    }

    .preview-list {
      display: grid;
      gap: 56px;
      margin-top: 54px;
    }

    .preview {
      overflow: hidden;
    }

    .preview-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 20px 22px;
      border-bottom: 1px solid var(--line);
      background: #fbfbfa;
    }

    .preview-title {
      margin: 0;
      font-size: 20px;
      font-weight: 400;
      line-height: 1.5;
      letter-spacing: 0;
    }

    .preview-info {
      color: var(--muted);
      display: block;
      font-size: 12px;
      line-height: 1.5;
      margin-top: 4px;
    }

    .preview-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
    }

    .button {
      border: 1px solid var(--accent);
      background: var(--accent-dark);
      color: #ffffff;
    }

    .button.secondary {
      background: var(--surface);
      color: var(--accent-dark);
    }

    .image-frame {
      background:
        linear-gradient(45deg, #eeeeec 25%, transparent 25%),
        linear-gradient(-45deg, #eeeeec 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #eeeeec 75%),
        linear-gradient(-45deg, transparent 75%, #eeeeec 75%);
      background-color: #f8f8f7;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0;
      background-size: 16px 16px;
      padding: 24px;
    }

    .image-frame img {
      background: #ffffff;
      border: 1px solid rgba(34, 34, 34, 0.08);
      display: block;
      height: auto;
      margin: 0 auto;
      max-width: 100%;
      width: 960px;
    }

    .preview.is-sp .image-frame img {
      width: 390px;
    }

    .site-footer {
      color: var(--muted);
      font-size: 12px;
      margin-top: 54px;
      text-align: center;
    }

    @media (max-width: 760px) {
      .header-inner {
        align-items: flex-start;
        flex-direction: column;
      }

      .header-actions,
      .preview-actions {
        justify-content: flex-start;
      }

      main {
        padding: 38px 16px 64px;
      }

      .intro {
        grid-template-columns: 1fr;
        gap: 24px;
      }

      h1 {
        font-size: 28px;
      }

      .preview-head {
        align-items: flex-start;
        flex-direction: column;
      }

      .image-frame {
        padding: 12px;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="#top" aria-label="renri design preview top">
        <span class="brand-title">renri</span>
        <span class="brand-label">Design Preview</span>
      </a>
      <nav class="header-actions" aria-label="ページリンク">
        <a class="nav-link" href="#top">Top</a>
        <a class="nav-link" href="#previews">Designs</a>
        <a class="nav-link" href="wireframes.html">Wireframes</a>
      </nav>
    </div>
  </header>

  <main id="top">
    <section class="intro" aria-labelledby="page-title">
      <div>
        <h1 id="page-title">renri デザイン確認</h1>
        <p class="lead">designフォルダのPNGカンプをブラウザで確認できるプレビューです。PC版とSP版をそれぞれ原寸画像としても開けます。</p>
        <nav class="quick-links" id="quick-links" aria-label="デザイン一覧リンク"></nav>
      </div>
      <aside class="meta-panel" aria-label="ファイル情報">
        <div class="meta-row">
          <span class="meta-key">Source</span>
          <span>design フォルダ</span>
        </div>
        <div class="meta-row">
          <span class="meta-key">Images</span>
          <span id="image-count">15 files</span>
        </div>
        <div class="meta-row">
          <span class="meta-key">Width</span>
          <span>PC 1440px / SP 750px</span>
        </div>
      </aside>
    </section>

    <section class="preview-list" id="previews" aria-label="デザイン一覧"></section>

    <p class="site-footer">renri design preview</p>
  </main>

  <script>
    const designs = [
      { title: "navi_sp", file: "navi_sp.png", width: 750, height: 1930, type: "sp" },
      { title: "オーダーコースTOP", file: "オーダーコースTOP.png", width: 1440, height: 7509 },
      { title: "オーダーコースTOP（PC）", file: "オーダーコースTOP_pc.png", width: 1440, height: 7509 },
      { title: "オーダーコースTOP（SP）", file: "オーダーコースTOP_sp.png", width: 750, height: 14881, type: "sp" },
      { title: "オーダーメイド婚約指輪（PC）", file: "オーダーメイド婚約指輪_pc.png", width: 1440, height: 12954 },
      { title: "オーダーメイド婚約指輪（SP）", file: "オーダーメイド婚約指輪_sp.png", width: 750, height: 23526, type: "sp" },
      { title: "オーダーメイド結婚指輪", file: "オーダーメイド結婚指輪.png", width: 1440, height: 11867 },
      { title: "オーダーメイド結婚指輪（PC）", file: "オーダーメイド結婚指輪_pc.png", width: 1440, height: 11836 },
      { title: "オーダーメイド結婚指輪（SP）", file: "オーダーメイド結婚指輪_sp.png", width: 750, height: 21461, type: "sp" },
      { title: "手作りコースTOP（PC）", file: "手作りコースTOP_pc.png", width: 1440, height: 6408 },
      { title: "手作りコースTOP（SP）", file: "手作りコースTOP_sp.png", width: 750, height: 13004, type: "sp" },
      { title: "手作り婚約指輪（PC）", file: "手作り婚約指輪_pc.png", width: 1440, height: 11474 },
      { title: "手作り婚約指輪（SP）", file: "手作り婚約指輪_sp.png", width: 750, height: 20392, type: "sp" },
      { title: "手作り結婚指輪（PC）", file: "手作り結婚指輪_pc.png", width: 1440, height: 11490 },
      { title: "手作り結婚指輪（SP）", file: "手作り結婚指輪_sp.png", width: 750, height: 20560, type: "sp" }
    ];

    const previews = document.querySelector("#previews");
    const quickLinks = document.querySelector("#quick-links");
    const imageCount = document.querySelector("#image-count");

    imageCount.textContent = `${designs.length} files`;

    designs.forEach((design, index) => {
      const id = `design-${index + 1}`;
      const path = `design/${design.file}`;
      const article = document.createElement("article");
      article.className = `preview${design.type === "sp" ? " is-sp" : ""}`;
      article.id = id;
      article.innerHTML = `
        <div class="preview-head">
          <div>
            <h2 class="preview-title">${design.title}</h2>
            <span class="preview-info">${design.width} x ${design.height}px / ${path}</span>
          </div>
          <div class="preview-actions">
            <a class="button" href="${path}" target="_blank" rel="noopener">原寸で開く</a>
            <a class="button secondary" href="#top">上へ戻る</a>
          </div>
        </div>
        <div class="image-frame">
          <img src="${path}" alt="${design.title}のデザインカンプ" width="${design.width}" height="${design.height}" loading="lazy">
        </div>
      `;
      previews.append(article);

      const link = document.createElement("a");
      link.className = "nav-link";
      link.href = `#${id}`;
      link.textContent = design.title;
      quickLinks.append(link);
    });
  </script>
</body>
</html>
